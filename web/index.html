<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta content="IE=Edge" http-equiv="X-UA-Compatible"/>
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="WeatherFlow"/>
  <link rel="apple-touch-icon" href="icons/Icon-192.png"/>

  <!-- Favicon & manifest -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json"/>

  <!-- Base href for correct path resolution -->
  <base href="$FLUTTER_BASE_HREF"/>

  <title>WeatherFlow</title>

  <!-- Load the Flutter engine (flutter.js) -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <!-- This script bootstraps your Dart app -->
  <script>
    window.addEventListener('load', function (event) {
      _flutter.loader
        .loadEntrypoint({ serviceWorker: { enabled: false } })
        .then(function (engineInitializer) {
          return engineInitializer.initializeEngine();
        })
        .then(function (appRunner) {
          return appRunner.runApp();
        });
    });
  </script>
</body>
</html>
